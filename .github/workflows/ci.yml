name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (lint, tests, benchmarks)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tc
          POSTGRES_DB: tradecore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - run: go vet ./...
      - name: Unit, invariant and Postgres integration tests
        run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:tc@localhost:5432/tradecore?sslmode=disable
      - name: Fuzz the matching engine
        run: go test ./internal/engine -run '^$' -fuzz FuzzBookInvariants -fuzztime 30s
      - name: Benchmarks
        run: |
          go test ./internal/engine -run '^$' -bench . -benchtime 2s -count 3 | tee bench.txt
          { echo '### Matching engine benchmarks'; echo '```'; grep Benchmark bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.txt

  web:
    name: Web (lint, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tradecore:ci
